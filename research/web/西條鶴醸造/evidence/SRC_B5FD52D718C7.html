<script type="text/javascript" charset="utf-8">
  let prefecture = null;
  let deliveryId = null;

  document.getElementById('amazon-pay-buy-now-view-cart').addEventListener('click', function() {
    document.querySelector('form[name="amazon_pay_buy_now_view_cart_form"]').submit();
  });

  const openColomreAmazonPayBuyNowProcessingModal = () => {
    const modal = document.querySelector('#amazon-pay-buy-now-modal')
    modal.style.visibility = 'hidden';
    modal.querySelectorAll('*').forEach(el => el.style.visibility = 'hidden');

    const processingModal = document.querySelector('#amazon-pay-buy-now-processing-modal')
    processingModal.style.visibility = "visible";
    processingModal.querySelectorAll('*').forEach(el => el.style.visibility = "visible");
  }

  const closeColomreAmazonPayBuyNowProcessingModal = () => {
    const modal = document.querySelector('#amazon-pay-buy-now-modal')
    modal.style.visibility = 'visible';
    modal.querySelectorAll('*').forEach(el => el.style.visibility = 'visible');

    const processingModal = document.querySelector('#amazon-pay-buy-now-processing-modal')
    processingModal.style.visibility = "hidden";
    processingModal.querySelectorAll('*').forEach(el => el.style.visibility = "hidden");
  }

  amazon.Pay.renderJSButton('#AmazonPayButton', {
    merchantId: 'A1KXWZ4V0BGRBL',
    ledgerCurrency: 'JPY',
        checkoutLanguage: 'ja_JP',
    productType: 'PayAndShip',
    placement: 'Cart',
    buttonColor: 'Gold',
    checkoutSessionConfig: {
      storeId: 'amzn1.application-oa2-client.3b0f396b167b4a7ebff569b930163a4a',
      scopes: ["name", "email", "phoneNumber", "billingAddress"],
      paymentDetails: {
        paymentIntent: "AuthorizeWithCapture",
        canHandlePendingAuthorization: false,
        allowOvercharge: true
      },
      platformId: "A1RPRQMW5V5B38",
      deliverySpecifications: {
        addressRestrictions: {
          type: "Allowed",
          restrictions: {
            JP: {
              statesOrRegions: ["北海道","青森県","岩手県","宮城県","秋田県","山形県","福島県","茨城県","栃木県","群馬県","埼玉県","千葉県","東京都","神奈川県","新潟県","富山県","石川県","福井県","山梨県","長野県","岐阜県","静岡県","愛知県","三重県","滋賀県","京都府","大阪府","兵庫県","奈良県","和歌山県","鳥取県","島根県","岡山県","広島県","山口県","徳島県","香川県","愛媛県","高知県","福岡県","佐賀県","長崎県","熊本県","大分県","宮崎県","鹿児島県","沖縄県"]
            }
          }
        }
      }
    },
    onInitCheckout: async function (event) {
      prefecture = event.shippingAddress.stateOrRegion;

      openColomreAmazonPayBuyNowProcessingModal();

      try {
        const response = await fetch(
          "/cart/api/public/basket/amazon_pay_buy_now/checkout_sessions",
          {
            method: "POST",
            headers: {
              "Content-type": "application/json"
                          },
            body: JSON.stringify({
              shop_id: 'PA01456673',
              type: "onInitCheckout",
              prefecture: prefecture,
              shipping_address: event.shippingAddress,
              buyer: event.buyer,
              billing_address: event.billingAddress
            })
          }
        );

        if (!response.ok) {
          closeColomreAmazonPayBuyNowProcessingModal();

          const errorResponse = await response.json();
          const errorType = errorResponse.error_type

          return {
            "status": "error",
            "reasonCode": errorType
          }
        }

        const result = await response.json();
        return result;
      } catch (_e) {
        closeColomreAmazonPayBuyNowProcessingModal();

        return {
          status: "error",
          reasonCode: "unknownError",
        }
      }
    },
    onShippingAddressSelection: async function (event) {
      try {
        const response = await fetch(
          "/cart/api/public/basket/amazon_pay_buy_now/checkout_sessions",
          {
            method: "POST",
            headers: {
              "Content-type": "application/json"
                            },
            body: JSON.stringify({
              shop_id: 'PA01456673',
              type: "onShippingAddressSelection",
              prefecture: event.shippingAddress.stateOrRegion,
              shipping_address: event.shippingAddress
            })
          }
        );

        if (!response.ok) {
          closeColomreAmazonPayBuyNowProcessingModal();

          return {
            "status": "error",
            "reasonCode": "shippingAddressInvalid"
          }
        }

        const result = await response.json();
        return result;
      } catch (_e) {
        closeColomreAmazonPayBuyNowProcessingModal();

        return {
          status: "error",
          reasonCode: "unknownError",
        }
      }
    },
    onDeliveryOptionSelection: async function (event) {
      deliveryId = event.deliveryOptions.id

      try {
        const response = await fetch(
          "/cart/api/public/basket/amazon_pay_buy_now/checkout_sessions",
          {
            method: "POST",
            headers: {
              "Content-type": "application/json"
                            },
            body: JSON.stringify({
              shop_id: 'PA01456673',
              type: "onDeliveryOptionSelection",
              delivery_id: event.deliveryOptions.id,
              prefecture: prefecture
            })
          }
        );

        if (!response.ok) {
          closeColomreAmazonPayBuyNowProcessingModal();

          return {
            "status": "error",
            "reasonCode": "deliveryOptionInvalid"
          }
        }

        const result = await response.json();

        return result;
      } catch (_e) {
        closeColomreAmazonPayBuyNowProcessingModal();

        return {
          status: "error",
          reasonCode: "unknownError",
        }
      }
    },
        onMerchantManagedPaymentMethodSelection: async function (event) {
      try {
        const methods = event.merchantManagedPaymentMethods ?? {};
        const shopId = 'PA01456673';
        const body = {
          shop_id: shopId,
          type: "onMerchantManagedPaymentMethodSelection",
          promo_codes: methods.promoCodes ?? [],
          authorization_required: event.authorizationRequired
        };
        if (methods.points != null) {
          body.use_points = methods.points.amount;
        }

        if (!!methods.promoCodes && methods.promoCodes.length > 0) {
          const allCookies = Object.fromEntries(
            document.cookie.split('; ').map(c => c.split('='))
          );

          const shopKey = shopId.replace('PA', 'CN');
          const pattern = new RegExp(`^(colorme_)?${shopKey}.+`);

          const keys = Object.keys(allCookies)
            .filter(key => allCookies[key] === '1' && pattern.test(key))
            .map(key => key.replace(/^colorme_/, ''));
          body.used_coupons = keys;
        }

        const response = await fetch(
          "/cart/api/public/basket/amazon_pay_buy_now/checkout_sessions",
          {
            method: "POST",
            headers: {
              "Content-type": "application/json"
                            },
            body: JSON.stringify(body)
          }
        );

        if (!response.ok) {
          closeColomreAmazonPayBuyNowProcessingModal();

          const errorResponse = await response.json();
          return {
            "status": "error",
            "reasonCode": errorResponse.reasonCode || "unknownError"
          }
        }

        return response.json();
      } catch (_e) {
        closeColomreAmazonPayBuyNowProcessingModal();

        return {
          status: "error",
          reasonCode: "unknownError",
        }
      }
    },
        onCompleteCheckout: async function (event) {
      const form = document.querySelector('form[name="amazon_pay_buy_now_checkout_form"]')

      form.querySelectorAll('input').forEach(input => {
        if (input.name === 'shop_id') {
          input.value = 'PA01456673';
        }
        if (input.name === 'checkout_session_id') {
          input.value = event.amazonCheckoutSessionId;
        }
      });

      if (event.deliveryOptions && event.deliveryOptions.dateTimeWindow) {
        event.deliveryOptions.dateTimeWindow.forEach((d, i) => {
          const typeInput = document.createElement('input');
          typeInput.name = "delivery_options[][type]";
          typeInput.value = d.type;
          form.append(typeInput)

          const valueInput = document.createElement('input')
          valueInput.name = "delivery_options[][value]";
          valueInput.value = d.value;
          form.append(valueInput)
        })
      }

      const newsletterCheckbox = (event.checkboxes || []).find(c => c.template === "NEWSLETTER_SIGN_UP");
      if (newsletterCheckbox) {
        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'receive_mail_magazine';
        input.value = newsletterCheckbox.isChecked ? 'true' : 'false';
        form.append(input);
      }

      // 「ご注文者情報」で購入者が選択した住所（送り主 / SenderFrom）を購入確定リクエストに載せる。
      // ゲスト購入のときだけ Amazon Pay 側でセクションが表示されるため、
      // 会員ログイン中・Amazon アカウント連携済みでは event.senderAddress は返らない。
      // refs: colorme/colorme-cart#7593
      if (event.senderAddress) {
        const senderAddressKeys = [
          "name", "addressLine1", "addressLine2", "addressLine3",
          "city", "county", "district", "stateOrRegion", "postalCode", "countryCode", "phoneNumber"
        ];

        senderAddressKeys.forEach(key => {
          const value = event.senderAddress[key];
          if (value === null || value === undefined) return;

          const input = document.createElement('input');
          input.type = 'hidden';
          input.name = 'sender_address[' + key + ']';
          input.value = value;
          form.append(input);
        });
      }

      form.submit();
    },
    onCancel: function (event) {
      closeColomreAmazonPayBuyNowProcessingModal();
    }
  });
</script>
